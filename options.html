<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书 To Markdown - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img class="logo" src="icon.svg" alt="飞书 To Markdown">
      <div>
        <h1>飞书 To Markdown</h1>
        <p>设置在哪些网站按 Ctrl+C 时自动复制为 Markdown。</p>
      </div>
    </header>

    <section aria-labelledby="domains-title">
      <div class="setting-row">
        <div>
          <label id="replace-copy-label" for="replace-copy">启用飞书 To Markdown</label>
          <p>这是插件的总开关。开启后，在飞书文档页面按 Ctrl+C，会自动将选中的内容复制为 Markdown。</p>
        </div>
        <input class="switch" id="replace-copy" type="checkbox" role="switch" aria-labelledby="replace-copy-label">
      </div>

      <div class="domain-settings">
      <div class="section-head">
        <div>
          <h2 id="domains-title">生效域名</h2>
          <p>每行一个域名。填写根域名会同时匹配它的子域名，也可以写成 <code>*.example.com</code>。</p>
        </div>
        <button class="secondary" id="reset" type="button">恢复默认</button>
      </div>
      <label for="domains">域名列表</label>
      <textarea id="domains" rows="6" spellcheck="false" placeholder="feishu.cn&#10;larksuite.com"></textarea>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <div class="permission-row hidden" id="permission-row">
        <span id="permission-text">自定义域名需要网站访问权限。</span>
        <button class="primary" id="grant" type="button">授权域名</button>
      </div>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
