<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书 To Markdown - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img class="logo" src="icon.svg" alt="飞书 To Markdown">
      <div>
        <h1>飞书 To Markdown</h1>
        <p>飞书与 Markdown 双向转换，支持官方域名和企业专属域名。</p>
        <span class="version" id="version"></span>
      </div>
    </header>

    <section aria-labelledby="domains-title">
      <div class="setting-row">
        <div>
          <label id="replace-copy-label" for="replace-copy">启用飞书 To Markdown</label>
          <span class="status-badge" id="feature-status">检查中</span>
          <p>这是插件的总开关。开启后，在飞书文档页面按 Ctrl+C，会自动将选中的内容复制为 Markdown。</p>
        </div>
        <input class="switch" id="replace-copy" type="checkbox" role="switch" aria-labelledby="replace-copy-label">
      </div>

      <div class="setting-row markdown-paste-setting">
        <div>
          <label id="markdown-paste-label" for="markdown-paste">Markdown 粘贴转飞书格式</label>
          <p>开启后，在飞书编辑区粘贴纯文本 Markdown 时，自动转换标题、列表、表格等格式。普通文本和已有富文本不受影响。</p>
        </div>
        <input class="switch" id="markdown-paste" type="checkbox" role="switch" aria-labelledby="markdown-paste-label">
      </div>

      <div class="clipboard-tool">
        <div>
          <h2>转换当前剪贴板</h2>
          <p>将剪贴板里的 Markdown 写成飞书可识别的富文本，然后回到文档按 Ctrl+V。</p>
        </div>
        <button class="primary" id="convert-clipboard" type="button">转换剪贴板</button>
        <div class="message clipboard-message" id="clipboard-message" role="status" aria-live="polite"></div>
      </div>

      <div class="domain-settings">
      <div class="section-head">
        <div>
          <h2 id="domains-title">生效域名 <span class="domain-status out-of-range" id="domain-status">不在范围</span></h2>
          <p>使用专属域名的企业，也可以在这里添加并授权。每行一个域名。</p>
        </div>
        <div class="section-actions">
          <button class="secondary" id="reset" type="button">恢复默认</button>
          <button class="primary" id="grant" type="button" disabled>授权新域名</button>
        </div>
      </div>
      <label for="domains">域名列表</label>
      <textarea id="domains" rows="6" spellcheck="false" placeholder="feishu.cn&#10;larksuite.com"></textarea>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="converter.js"></script>
  <script src="options.js"></script>
</body>
</html>
